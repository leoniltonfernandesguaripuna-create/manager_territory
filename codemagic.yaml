workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Criar pastas nativas em pasta temporaria
        script: |
          mkdir -p /tmp/temp_project
          cd /tmp/temp_project
          flutter create --platforms android,ios --project-name territory_manager temp_app
          cd $CM_BUILD_DIR
          cp -r /tmp/temp_project/temp_app/android ./
          cp -r /tmp/temp_project/temp_app/ios ./

      - name: Gerar ícones do app
        script: dart run flutter_launcher_icons

      - name: Criar google-services.json
        script: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
