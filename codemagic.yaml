workflows:
  android-workflow:
    name: Território Manager Android
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Instalar dependências
        script: flutter pub get
      - name: Executar análise
        script: flutter analyze
      - name: Gerar APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
