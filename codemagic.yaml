workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      # O segredo aqui é colocar o conteúdo do seu google-services.json
      # como uma variável de ambiente no painel do Codemagic.
      # Nós vamos criá-la no próximo passo.
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
