workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Backup lib e criar pastas nativas
        script: |
          cp -r lib /tmp/lib_backup
          flutter create . --platforms android --project-name territory_manager
          rm -rf lib
          cp -r /tmp/lib_backup lib

      - name: DEBUG - Ver estrutura android
        script: |
          echo "=== android/ ==="
          ls -la android/
          echo ""
          echo "=== android/app/ ==="
          ls -la android/app/
          echo ""
          echo "=== android/app/src/ ==="
          ls -la android/app/src/
          echo ""
          echo "=== android/app/src/main/ ==="
          ls -la android/app/src/main/

      - name: Gerar ícones do app
        script: dart run flutter_launcher_icons

      - name: Criar google-services.json
        script: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
