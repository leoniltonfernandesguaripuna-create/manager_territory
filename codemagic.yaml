workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: DEBUG - Listar arquivos
        script: |
          echo "=== RAIZ ==="
          ls -la
          echo ""
          echo "=== LIB ==="
          ls -la lib/
          echo ""
          echo "=== LIB/SCREENS ==="
          ls -la lib/screens/
          echo ""
          echo "=== Commit atual ==="
          git log -1 --oneline

      - name: Criar pastas nativas
        script: flutter create . --platforms android,ios

      - name: Gerar ícones do app
        script: dart run flutter_launcher_icons

      - name: Criar google-services.json
        script: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: DEBUG - Listar depois do flutter create
        script: |
          echo "=== LIB/SCREENS depois do create ==="
          ls -la lib/screens/

      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
