name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: DEBUG - O que o Git conhece
        run: |
          echo "=== GIT LS-FILES lib/ ==="
          git ls-files lib/ || true
          echo ""
          echo "=== GIT LS-FILES lib/screens/ ==="
          git ls-files lib/screens/ || true
          echo ""
          echo "=== FIND em lib ==="
          find lib -type f || true
          echo ""
          echo "=== GITIGNORE existe? ==="
          find . -name ".gitignore" -o -name ".gitgnore" || true

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependências
        run: flutter pub get

      - name: Criar projeto Flutter em pasta separada
        run: |
          cd /tmp
          flutter create --project-name territory_manager --platforms android fresh_app

      - name: Remover android antigo e copiar o novo
        run: |
          rm -rf android
          cp -r /tmp/fresh_app/android ./android

      - name: Gerar ícones do app
        run: dart run flutter_launcher_icons

      - name: Criar google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json

      - name: Compilar APK
        run: flutter build apk --release

      - name: Salvar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
